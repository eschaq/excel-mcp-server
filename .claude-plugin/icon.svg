<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Spreadsheet (DWS Build)">
  <title>Spreadsheet (DWS Build)</title>
  <!-- DWS Build palette: navy #0F1F3D, teal #14B8A6, light grid #E6F4F2 -->
  <rect width="128" height="128" rx="24" fill="#0F1F3D"/>
  <!-- sheet -->
  <rect x="24" y="28" width="80" height="72" rx="8" fill="#E6F4F2"/>
  <!-- header row -->
  <path d="M24 36a8 8 0 0 1 8-8h64a8 8 0 0 1 8 8v8H24z" fill="#14B8A6"/>
  <!-- grid lines -->
  <g stroke="#0F1F3D" stroke-opacity="0.25" stroke-width="2">
    <line x1="24" y1="62" x2="104" y2="62"/>
    <line x1="24" y1="81" x2="104" y2="81"/>
    <line x1="51" y1="44" x2="51" y2="100"/>
    <line x1="77" y1="44" x2="77" y2="100"/>
  </g>
  <!-- highlighted cell -->
  <rect x="53" y="64" width="22" height="15" rx="2" fill="#14B8A6"/>
</svg>
