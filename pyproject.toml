[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dws-spreadsheet-mcp"
version = "0.1.0"
description = "MCP server that lets Claude read, analyze and edit local Excel and CSV files. No Microsoft Office required."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "DWS Build", email = "datawisdomsolutions@gmail.com" }]
keywords = ["mcp", "excel", "xlsx", "spreadsheet", "claude", "openpyxl"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]
dependencies = [
    "mcp>=2.2,<3",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "xlwt>=1.3"]  # xlwt builds the legacy .xls test fixture

[project.scripts]
dws-spreadsheet-mcp = "excel_mcp.server:main"

[project.urls]
Homepage = "https://github.com/eschaq/excel-mcp-server"

[tool.hatch.build.targets.wheel]
packages = ["src/excel_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# The plugin runs the server from source (PYTHONPATH=src) with `uv run --frozen`, so uv only
# installs the locked dependencies from uv.lock and never builds this project.
package = false
# For anyone running `uvx --from <this dir>`: rebuild when the source changes, not only pyproject.toml.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]
